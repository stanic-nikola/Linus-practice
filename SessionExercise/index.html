<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Engineering – Session 01</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Gemüse und Früchte</h1>

    <ul id="gemuese">
      <li class="kohlgemuese">Wirsing</li>
      <li class="kohlgemuese">Spitzkohl</li>
      <li class="blattsalate">Feldsalat</li>
    </ul>

    <ul id="obst">
      <li class="steinobst">Sauerkirsche</li>
      <li class="steinobst">Pflaume</li>
      <li class="kernobst">Birne</li>
      <li class="beerenobst">Johannisbeere</li>
      <li class="schalenobst">Erdnuss</li>
    </ul>

    <form action="/login" method="post">
      <label for="username">Username: </label>
      <input id="username" name="username" type="text" placeholder="Username" />
      <label for="password">Password: </label>
      <input id="password" name="password" type="password" placeholder="Password" />
      <button type="submit">Login</button>
    </form>
  </body>
</html>
