  <!-- LIVE TASK A: Ergänze hier ein Login-Formular.
       Anforderungen: action="/login", method="post",
       username (text), password (password), verbundene Labels,
       Button zum Absenden. -->
       <form action="/login" method="post">
        <label for="username">Benutzername</label>
        <input id="username" name="username" type="text">
        <label for="password">Passwort</label>
